<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Cicatrixa</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
<script src="/accounts.js" defer></script>
</head>
<body data-page="login">
<header class="masthead"><div class="wrap nav">
  <a class="wordmark" href="https://cicatrixa.com"><img src="/favicon.svg" width="22" height="22" alt="">
    <span><span class="r">cica</span><span class="g">trixa</span></span></a>
  <span class="spacer"></span>
  <a class="lnk" href="/login">Log in</a>
  <a class="btn sm" href="/signup">Sign up</a>
</div></header>
<main><div class="wrap">
<div class="narrow">
  <div class="lbl-caps">log in</div>
  <h1>Welcome <em>back</em></h1>
  <p class="sub">Log in to your workspace.</p>
  <div id="notice" class="ok" hidden></div>
  <div id="error" class="err" hidden></div>
  <form id="form" class="card" autocomplete="on">
    <label for="email">email</label>
    <input id="email" type="email" name="email" required autofocus autocomplete="email">
    <label for="password">password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <button class="btn full" type="submit">Log in →</button>
  </form>
  <p class="muted small" style="margin-top:16px"><a href="/forgot-password">Forgot your password?</a></p>
  <p class="muted small">New here? <a href="/signup">Create an account</a></p>
</div>
</div></main>
</body>
</html>
