<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — Cicatrixa</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
<script src="/accounts.js" defer></script>
</head>
<body data-page="reset">
<header class="masthead"><div class="wrap nav">
  <a class="wordmark" href="https://cicatrixa.com"><img src="/favicon.svg" width="22" height="22" alt="">
    <span><span class="r">cica</span><span class="g">trixa</span></span></a>
  <span class="spacer"></span>
  <a class="lnk" href="/login">Log in</a>
  <a class="btn sm" href="/signup">Sign up</a>
</div></header>
<main><div class="wrap">
<div class="narrow">
  <div class="lbl-caps">reset password</div>
  <h1>Choose a new <em>password</em></h1>
  <div id="error" class="err" hidden></div>
  <form id="form" class="card">
    <label for="password">new password</label>
    <input id="password" type="password" name="password" minlength="8" maxlength="128" required autofocus autocomplete="new-password">
    <button class="btn full" type="submit">Save new password →</button>
  </form>
  <div id="expired" class="card" hidden>
    <p class="small" style="margin-top:0">This reset link has expired or was already used. Links
      work once and last an hour.</p>
    <a class="btn" href="/forgot-password">Send a new link →</a>
  </div>
</div>
</div></main>
</body>
</html>
