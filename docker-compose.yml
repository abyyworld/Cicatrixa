networks:
  healnet:
    name: healnet

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    ports:
      - "80:80"       # live traffic (weighted stable/canary)
      - "8080:8080"   # traefik dashboard
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./traefik/dynamic:/dynamic"
    networks: [healnet]
    restart: unless-stopped

  app-stable:
    build: ./app
    image: orderservice:stable
    container_name: app-stable
    networks: [healnet]
    restart: unless-stopped

  healer:
    build: ./healer
    container_name: healer
    ports:
      - "9000:9000"   # self-healer dashboard (SSE)
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # host path of ./app, derived automatically — run compose from the repo root
      - HOST_APP_SRC=${PWD}/app
      - APPROVAL_MODE=${APPROVAL_MODE:-off}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./app:/workspace/app"
      - "./traefik/dynamic:/traefik-dynamic"
    networks: [healnet]
    depends_on: [app-stable, traefik]
    restart: unless-stopped
