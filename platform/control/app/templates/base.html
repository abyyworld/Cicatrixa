<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cicatrixa{% endblock %}</title>
<style>
  /* Cicatrixa app shell — same dark system as the landing page:
     near-black surface, arterial red / healed green accents, mono UI type. */
  :root{
    --bg:#0A0F0C; --panel:#101713; --panel2:#0C1210;
    --ink:#E4EEE7; --muted:#74857B; --line:#1F2B24;
    --scar:#FF5257; --healed:#40D967; --healed-dim:#2C7A45; --amber:#E8B44C;
    --serif:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* aliases some older templates reference */
    --red:var(--scar); --green:var(--healed); --green-dim:var(--healed-dim);
    --panel-deep:var(--panel2);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 var(--mono);-webkit-font-smoothing:antialiased}
  .serif{font-family:var(--serif)}
  .mono{font-family:var(--mono)}
  a{color:inherit}
  ::selection{background:var(--healed-dim);color:#fff}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}

  header.masthead{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(10px)}
  .nav{display:flex;align-items:center;height:60px;gap:22px}
  .wordmark{font:600 17px var(--mono);letter-spacing:-.02em;text-decoration:none}
  .wordmark .r{color:var(--scar)} .wordmark .g{color:var(--healed)}
  .nav a.lnk{font:12px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);text-decoration:none;transition:color .2s}
  .nav a.lnk:hover{color:var(--healed)}
  .nav .spacer{margin-left:auto}

  main{padding:44px 0 90px}
  h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.12;
    letter-spacing:-.01em;margin:0 0 8px}
  h1 em,.accent-i{font-style:normal;color:var(--healed)}
  h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:40px 0 14px}
  p.sub{color:var(--muted);margin:0 0 26px;font-size:14px}
  .lbl-caps{font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
  .grid{display:grid;gap:14px}

  .btn{display:inline-block;font:12.5px var(--mono);font-weight:600;letter-spacing:.06em;
    color:#06130A;background:var(--healed);border:1px solid var(--healed);
    border-radius:8px;padding:10px 20px;text-decoration:none;cursor:pointer;
    transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(64,217,103,.22)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.ghost:hover{color:var(--healed);border-color:var(--healed-dim);box-shadow:none;transform:none}
  .btn.danger{background:transparent;color:var(--scar);border-color:var(--line)}
  .btn.danger:hover{border-color:var(--scar);box-shadow:0 8px 20px rgba(255,82,87,.15);transform:none}
  .btn.sm{padding:6px 13px;font-size:11px;border-radius:6px}

  input[type=text],input[type=email],input[type=password],select{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);padding:10px 12px;font:14px var(--mono);outline:none;
    transition:border-color .2s}
  input:focus,select:focus{border-color:var(--healed-dim)}
  label{display:block;font:11px var(--mono);letter-spacing:.12em;color:var(--muted);
    margin:16px 0 6px;text-transform:uppercase}
  .err{color:var(--scar);font:13px var(--mono);border:1px solid rgba(255,82,87,.35);
    background:rgba(255,82,87,.08);border-radius:8px;padding:10px 14px;margin:14px 0}

  .pill{display:inline-flex;align-items:center;gap:5px;font:10.5px var(--mono);font-weight:600;
    padding:3px 11px;border-radius:99px;border:1px solid var(--muted);color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em}
  .pill::before{content:"●";font-size:8px;line-height:1}
  .pill.live{color:var(--healed);border-color:var(--healed-dim)}
  .pill.deploying,.pill.degraded{color:var(--amber);border-color:var(--amber)}
  .pill.failed{color:var(--scar);border-color:var(--scar)}
  .pill.stopped,.pill.new{color:var(--muted);border-color:var(--line)}

  .term{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;font:12.5px/1.75 var(--mono);color:#9fb3a7;
    white-space:pre-wrap;word-break:break-word;max-height:460px;overflow-y:auto}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font:10.5px var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.12em;
    color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line)}
  .muted{color:var(--muted)} .green{color:var(--healed)} .red{color:var(--scar)}
  code{font:.9em var(--mono);background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;padding:1px 6px}

  .meter{min-width:170px;flex:1}
  .meter .lbl{display:flex;justify-content:space-between;gap:14px;font:10.5px var(--mono);
    color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;
    white-space:nowrap}
  .meter .track{height:6px;background:var(--panel2);border:1px solid var(--line);
    border-radius:99px;overflow:hidden}
  .meter .fill{height:100%;background:var(--healed);border-radius:99px}
  .meter .fill.warn{background:var(--amber)} .meter .fill.crit{background:var(--scar)}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="masthead"><div class="wrap nav">
  <a class="wordmark" href="/"><span class="r">cica</span><span class="g">trixa</span></a>
  {% if user %}
    <a class="lnk" href="/dashboard">Dashboard</a>
    <a class="lnk" href="/projects/new">New project</a>
    {% if user.is_admin %}<a class="lnk" href="/admin">Admin</a>{% endif %}
    <span class="spacer"></span>
    <span class="lnk" style="cursor:default">{{ user.email }}</span>
    <form method="post" action="/logout" style="margin:0"><button class="btn ghost sm">Log out</button></form>
  {% else %}
    <span class="spacer"></span>
    <a class="lnk" href="/login">Log in</a>
    <a class="btn sm" href="/signup">Sign up</a>
  {% endif %}
</div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
</body>
</html>
