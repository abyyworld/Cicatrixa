networks:
  cxnet:
    name: cxnet
  healnet:
    external: true    # the self-heal demo's network; traefik routes demo.* into it

services:
  traefik:
    image: traefik:v3.6
    container_name: cx-traefik
    ports:
      - "80:80"       # platform UI + all user project subdomains
      - "443:443"     # HTTPS once a router references certResolver: le
      - "8080:8080"   # traefik dashboard (basic-auth, see demo security.yml)
      - "9000:9000"   # healer demo dashboard (basic-auth)
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "${DEMO_DYNAMIC_DIR:-/root/Cicatrixa/traefik/dynamic}:/dynamic"
      - "cx-letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks: [cxnet, healnet]
    restart: unless-stopped

  control:
    build: ./control
    container_name: cx-control
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - BASE_URL=${BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-5.1-codex-mini}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CX_NETWORK=cxnet
      - DEFAULT_QUOTA_SERVICES=${DEFAULT_QUOTA_SERVICES:-5}
      - DEFAULT_QUOTA_RAM_MB=${DEFAULT_QUOTA_RAM_MB:-2048}
      - DEFAULT_QUOTA_DISK_MB=${DEFAULT_QUOTA_DISK_MB:-5120}
      - RAM_PER_CONTAINER_MB=${RAM_PER_CONTAINER_MB:-768}
      - CPU_PER_CONTAINER=${CPU_PER_CONTAINER:-0.25}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Cicatrixa <noreply@cicatrixa.com>}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "cx-data:/data"
    networks: [cxnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cxnet"
      - "traefik.http.routers.cx-control.rule=Host(`${BASE_DOMAIN}`) || Host(`app.${BASE_DOMAIN}`) || Host(`www.${BASE_DOMAIN}`)"
      - "traefik.http.routers.cx-control.entrypoints=web"
      - "traefik.http.routers.cx-control.service=cx-control"
      - "traefik.http.routers.cx-control.middlewares=${HTTPS_REDIRECT_MW:-cx-to-https}"
      # catch-all so the bare IP (no Host match) also lands on the platform UI (HTTP only —
      # a bare IP can't hold a valid cert, so this one is never redirected)
      - "traefik.http.routers.cx-control-fallback.rule=PathPrefix(`/`)"
      # priority 5 keeps the platform above the demo's PathPrefix(`/`) catch-all,
      # which the file provider contributes at priority 1
      - "traefik.http.routers.cx-control-fallback.priority=5"
      - "traefik.http.routers.cx-control-fallback.entrypoints=web"
      - "traefik.http.routers.cx-control-fallback.service=cx-control"
      - "traefik.http.services.cx-control.loadbalancer.server.port=8090"
      - "traefik.http.middlewares.cx-to-https.redirectscheme.scheme=https"
      # 302, not 301: a permanent redirect to a :443 that cannot answer is cached by
      # browsers indefinitely, so flipping HTTPS_REDIRECT_MW later would not rescue
      # anyone who already visited.
      - "traefik.http.middlewares.cx-to-https.redirectscheme.permanent=false"
      # HTTPS_REDIRECT_MW=cx-plain swaps the redirect for a harmless middleware, so a
      # certificate that fails to issue degrades to plain HTTP instead of blacking out
      # the site (an unreachable :443 behind a permanent redirect looks like a timeout).
      - "traefik.http.middlewares.cx-plain.compress=true"
      # HTTPS twin — same host rule, on :443, cert issued on first request (HTTP-01)
      - "traefik.http.routers.cx-control-secure.rule=Host(`${BASE_DOMAIN}`) || Host(`app.${BASE_DOMAIN}`) || Host(`www.${BASE_DOMAIN}`)"
      - "traefik.http.routers.cx-control-secure.entrypoints=websecure"
      - "traefik.http.routers.cx-control-secure.service=cx-control"
      - "traefik.http.routers.cx-control-secure.tls.certresolver=le"

volumes:
  cx-data:
  cx-letsencrypt:
