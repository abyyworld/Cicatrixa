networks:
  cxnet:
    name: cxnet
  healnet:
    external: true    # the self-heal demo's network; traefik routes demo.* into it

services:
  traefik:
    image: traefik:v3.6
    container_name: cx-traefik
    ports:
      # Defaults are the real ports, so the server is unchanged. They are
      # variables because a laptop is not a server: 80 and 443 are privileged,
      # and some container runtimes on macOS cannot bind them without extra
      # setup — local.sh moves them rather than failing to start.
      - "${CX_HTTP_PORT:-80}:80"        # platform UI + all user project subdomains
      - "${CX_HTTPS_PORT:-443}:443"     # HTTPS once a router references certResolver: le
      # The two admin ports bind to loopback by default: reach them over an SSH
      # tunnel. Docker-published ports bypass the host's INPUT firewall entirely,
      # so "the firewall only allows 80/443" does not protect anything bound to
      # 0.0.0.0 here — and neither router behind these has real auth configured.
      - "${CX_TRAEFIK_PORT:-127.0.0.1:8080}:8080" # traefik dashboard
      - "${CX_HEALER_PORT:-127.0.0.1:9000}:9000"  # healer demo dashboard
    volumes:
      - "./traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "${DEMO_DYNAMIC_DIR:-/root/Cicatrixa/traefik/dynamic}:/dynamic"
      - "cx-letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks: [cxnet, healnet]
    restart: unless-stopped

  control:
    build: ./control
    container_name: cx-control
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - BASE_URL=${BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-5.1-codex-mini}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CX_NETWORK=cxnet
      - DEFAULT_QUOTA_SERVICES=${DEFAULT_QUOTA_SERVICES:-5}
      - DEFAULT_QUOTA_RAM_MB=${DEFAULT_QUOTA_RAM_MB:-2048}
      - DEFAULT_QUOTA_DISK_MB=${DEFAULT_QUOTA_DISK_MB:-5120}
      - RAM_PER_CONTAINER_MB=${RAM_PER_CONTAINER_MB:-768}
      - CPU_PER_CONTAINER=${CPU_PER_CONTAINER:-0.25}
      - RAM_PER_DB_MB=${RAM_PER_DB_MB:-512}
      - BUILD_MEM_MB=${BUILD_MEM_MB:-2048}
      - BUILD_CONCURRENCY=${BUILD_CONCURRENCY:-2}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-Cicatrixa <noreply@cicatrixa.com>}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "cx-data:/data"
    networks: [cxnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cxnet"
      # app.<domain> ONLY. The apex and www belong to the marketing site (Vercel) and
      # must never appear in a certresolver router here: Traefik turns every Host()
      # in a rule into one certificate order, Let's Encrypt's check for the apex lands
      # on Vercel and fails, and one failed name fails the whole order — so app.
      # never got a trusted certificate. Unmatched hosts on :80 still reach the UI
      # through cx-control-fallback below.
      - "traefik.http.routers.cx-control.rule=Host(`app.${BASE_DOMAIN}`)"
      - "traefik.http.routers.cx-control.entrypoints=web"
      - "traefik.http.routers.cx-control.service=cx-control"
      - "traefik.http.routers.cx-control.middlewares=${HTTPS_REDIRECT_MW:-cx-to-https}"
      # catch-all so the bare IP (no Host match) also lands on the platform UI (HTTP only —
      # a bare IP can't hold a valid cert, so this one is never redirected)
      - "traefik.http.routers.cx-control-fallback.rule=PathPrefix(`/`)"
      # priority 5 keeps the platform above the demo's PathPrefix(`/`) catch-all,
      # which the file provider contributes at priority 1
      - "traefik.http.routers.cx-control-fallback.priority=5"
      - "traefik.http.routers.cx-control-fallback.entrypoints=web"
      - "traefik.http.routers.cx-control-fallback.service=cx-control"
      - "traefik.http.services.cx-control.loadbalancer.server.port=8090"
      - "traefik.http.middlewares.cx-to-https.redirectscheme.scheme=https"
      # 302, not 301: a permanent redirect to a :443 that cannot answer is cached by
      # browsers indefinitely, so flipping HTTPS_REDIRECT_MW later would not rescue
      # anyone who already visited.
      - "traefik.http.middlewares.cx-to-https.redirectscheme.permanent=false"
      # HTTPS_REDIRECT_MW=cx-plain swaps the redirect for a harmless middleware, so a
      # certificate that fails to issue degrades to plain HTTP instead of blacking out
      # the site (an unreachable :443 behind a permanent redirect looks like a timeout).
      - "traefik.http.middlewares.cx-plain.compress=true"
      # What every USER APP's :80 router runs. Apps reference this fixed name rather
      # than carrying the switch in their own labels, which are frozen when the
      # container is created — so flipping HTTPS_REDIRECT_MW and recreating
      # cx-control re-points every running app at once, no redeploys.
      - "traefik.http.middlewares.cx-app-web.chain.middlewares=${HTTPS_REDIRECT_MW:-cx-to-https}"
      # HTTPS_REDIRECT_MW=cx-tunnel (tunnel.sh). TLS ended at Cloudflare, and Traefik's
      # plain :80 entrypoint overwrites the X-Forwarded-Proto: https that cloudflared
      # passes on with "http" — so an app that forces HTTPS (Rails force_ssl, Django
      # SECURE_SSL_REDIRECT, Express on req.secure) would redirect forever, and its
      # secure cookies never stick. Every request here did arrive over HTTPS:
      # Cloudflare's Always Use HTTPS redirects the rest before they reach the tunnel.
      # No compress either: it holds a response's headers until its first byte, and
      # Cloudflare cuts a response with no headers after ~100 s (live logs, SSE).
      - "traefik.http.middlewares.cx-tunnel.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.cx-tunnel.headers.customrequestheaders.X-Forwarded-Port=443"
      # Cloudflare would otherwise keep apps' .js/.css/images at its edge for hours,
      # and nothing here can purge it after a redeploy or a heal. Browsers' own
      # caching is untouched: this header is read by Cloudflare alone.
      - "traefik.http.middlewares.cx-tunnel.headers.customresponseheaders.Cloudflare-CDN-Cache-Control=no-store"
      # HTTPS twin — same host rule, on :443, cert issued on first request (HTTP-01)
      - "traefik.http.routers.cx-control-secure.rule=Host(`app.${BASE_DOMAIN}`)"
      - "traefik.http.routers.cx-control-secure.entrypoints=websecure"
      - "traefik.http.routers.cx-control-secure.service=cx-control"
      - "traefik.http.routers.cx-control-secure.tls.certresolver=le"

  # The free way to put the platform on the internet: no public IP, no open port,
  # no certificate to issue. cloudflared dials OUT to Cloudflare, which already
  # serves this domain's DNS and terminates TLS at its edge, and hands every request
  # for app.<domain> and *.<domain> to cx-traefik:80 — so any machine with Docker
  # can host it, a home PC behind a router included. Off unless .env says
  # COMPOSE_PROFILES=tunnel; tunnel.sh writes that and the token. The routes and DNS
  # records live in the Cloudflare dashboard: docs/RUNBOOK.md, "Free: Cloudflare Tunnel".
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cx-tunnel
    profiles: [tunnel]
    # Metrics on loopback: on its default 0.0.0.0 every customer container on cxnet
    # could read /config and /debug/pprof. verify-public.sh asks it `ready` from inside.
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [cxnet]
    depends_on: [traefik]
    restart: unless-stopped

volumes:
  cx-data:
  cx-letsencrypt:
