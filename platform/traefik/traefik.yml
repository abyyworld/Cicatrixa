entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  dashboard:
    address: ":9000"     # healer demo UI (basic-auth via file provider)
  traefikapi:
    address: ":8080"     # traefik dashboard (basic-auth via file provider)

providers:
  docker:
    exposedByDefault: false
    network: cxnet
    # Keep a container's routers and middlewares while its healthcheck says
    # starting/unhealthy (its own service answers 503 meanwhile). cx-control has a
    # healthcheck and defines cx-app-web, the middleware every app's :80 router uses:
    # without this, each cx-control restart made Traefik drop that middleware and
    # 404 every customer app on :80 — which in tunnel mode is all of their traffic.
    allowEmptyServices: true
  file:
    directory: /dynamic
    watch: true

# Inert until a router references certResolver: le (HTTP-01, one cert per
# hostname on first request) — so this is safe to ship before any router
# uses it. Cut over BASE_DOMAIN to the real domain first, then add
# tls.certresolver=le labels; doing it on a domain we don't control (e.g.
# a shared nip.io) would burn rate limits shared with everyone else on it.
certificatesResolvers:
  le:
    acme:
      # The ACME account contact. Must be an address the owner reads.
      email: hello@cicatrixa.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: true
  insecure: false

log:
  level: INFO
